name: Ruby

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    name: Ruby ${{ matrix.ruby }} on ${{ matrix.os }}
    timeout-minutes: 10
    continue-on-error: ${{ matrix.ruby == 'head' }}
    strategy:
      fail-fast: false
      matrix:
        # Brutal runs the code in children through Aw, on fork(2): test both kernels.
        os:
          - ubuntu-latest
          - macos-latest
        ruby:
          - "3.3"
          - "3.4"
          - "4.0"
          - head

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Ruby
      uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true

    - name: Run the test task
      run: bundle exec rake test
